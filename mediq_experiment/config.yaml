# MediQ Interactive Best: ScaleExpert + RG + SC=3, max_questions=30
# Doctors A/B: API (GPT / Claude) | C/D/E: local HF (vLLM on CARC)
# Patient + Judge: Claude Haiku 4.5
# Run:  python -m mediq_experiment.run_pipeline
#
# HF_HOME (CARC model cache):
#   /project2/ruishanl_1185/proj-26su-agent-trial-design/Ray/Agent_Trial_Design/model
#   export HF_HOME=...  (also set in run.sh / slurm_mediq_ae.sh)

data:
  source_path: "data/all_dev_good.jsonl"
  id_min: 100                        # inclusive
  id_max: 199                        # inclusive → 100 cases
  max_cases: null                    # null = all ids in [id_min, id_max]

mediq:
  expert_class: "ScaleExpert"        # Interactive Best (not BasicExpert)
  patient_class: "FactSelectPatient"
  max_questions: 30                  # MediQ default hard cap
  abstain_threshold: 4.0             # Scale Likert: answer only if conf >= 4
  # Optional default API for unknown ids; per-model provider wins.
  # Mixed API + local: do not set use_api globally when running HF doctors.
  use_api: null
  # Local HF doctors (C/D/E): prefer vLLM on CARC; falls back to transformers.
  use_vllm: true
  load_in_4bit: false                # transformers fallback only; vLLM ignores this
  rationale_generation: true
  self_consistency: 3                # paper Interactive Best
  temperature: 0.6
  max_tokens: 512                    # Scale+RG needs a bit more room

models:
  doctor_a:
    provider: "openai"
    name: "gpt-5.4"
  doctor_b:
    provider: "anthropic"
    name: "claude-sonnet-4-6"
  doctor_c:
    provider: "huggingface"
    name: "meta-llama/Llama-3.1-8B-Instruct"
  doctor_d:
    provider: "huggingface"
    name: "Qwen/Qwen2.5-7B-Instruct"
  doctor_e:
    provider: "huggingface"
    name: "aaditya/Llama3-OpenBioLLM-8B"
  patient:
    provider: "anthropic"
    name: "claude-haiku-4-5"
  judge:
    provider: "anthropic"
    name: "claude-haiku-4-5"
    temperature: 0.1

pipeline:
  run_mediq: true
  score_coverage: true
  cross_finalize: true
  skip_existing: true                # skip non-empty results/scored/cross files
  output_dir: "mediq_experiment/outputs"
