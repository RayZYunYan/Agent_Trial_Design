# MediQ Interactive Best — Mac mini (M4 Pro / 48GB) defaults to Apple MLX
# Doctors:
#   A = gpt-5.4 | B = claude-sonnet-4-6 | C = gpt-5.6-luna (APIs)
#   D/E = local via mlx-lm 4-bit (fast on Apple Silicon)
#
#   bash mediq_experiment/download_local_models.sh
#   bash mediq_experiment/run_mac_smoke.sh
#   bash mediq_experiment/run_mac.sh

data:
  source_path: "data/all_dev_good.jsonl"
  id_min: 100
  id_max: 199
  max_cases: null

mediq:
  expert_class: "ScaleExpert"
  patient_class: "FactSelectPatient"
  max_questions: 30
  abstain_threshold: 4.0
  use_api: null
  use_vllm: false
  use_mlx: true                 # Apple Silicon accelerator (mlx-lm)
  load_in_4bit: false
  rationale_generation: true
  self_consistency: 3
  temperature: 0.6
  max_tokens: 512

models:
  doctor_a:
    provider: "openai"
    name: "gpt-5.4"
  doctor_b:
    provider: "anthropic"
    name: "claude-sonnet-4-6"
  doctor_c:
    provider: "openai"
    name: "gpt-5.6-luna"
  doctor_d:
    provider: "huggingface"
    name: "Qwen/Qwen3.5-4B"
    # mlx-lm 4-bit (text); official *-MLX-4bit builds need mlx-vlm
    mlx_name: "mlx-community/Qwen3.5-4B-OptiQ-4bit"
  doctor_e:
    provider: "huggingface"
    name: "meta-llama/Llama-3.1-8B-Instruct"
    mlx_name: "mlx-community/Meta-Llama-3.1-8B-Instruct-4bit"
  patient:
    provider: "anthropic"
    name: "claude-haiku-4-5"
  judge:
    provider: "anthropic"
    name: "claude-haiku-4-5"
    temperature: 0.1

pipeline:
  run_mediq: true
  score_coverage: true
  cross_finalize: true
  skip_existing: true
  output_dir: "mediq_experiment/outputs"
