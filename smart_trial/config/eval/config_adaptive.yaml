# Phase-2 closed-loop placeholder — uses grid-trained Q on medqa_0100..0149.
# Not wired in phase-1; kept for CARC job scaffolding.

run:
  mode: smart_adaptive_loop   # TODO: implement in phase 2
  refit_every_n: 5
  initial_q_from: "smart_trial/outputs/eval/grid/grid_encounters.jsonl"

eval:
  fix_persona_per_case: true
  case_ids: null   # defaults to medqa_0100..0149 when implemented

trial:
  stage1_turns: 4
  stage2_turns: 6
  R1_responder_threshold: 6
  R2_high_confidence_threshold: 0.7

data:
  source: "local"
  local:
    path: "data/all_dev_good.jsonl"
    max_cases: null
  red_flag_cache: "smart_trial/data/red_flag_cache.json"

models:
  patient_simulator:
    provider: anthropic
    model_name: claude-sonnet-4-6
    temperature: 0.3
  doctor_agent:
    provider: anthropic
    model_name: claude-sonnet-4-6
    temperature: 0.5
  judge:
    provider: anthropic
    model_name: claude-sonnet-4-6
    temperature: 0.1

randomization:
  seed: 42
  stratify_by: "case_category"

persona:
  mode: "per_case_seed"

rag:
  enabled: true
  k: 3
  index_cache: "smart_trial/data/bm25_index.pkl"

logging:
  output_dir: "smart_trial/outputs/eval/adaptive"
  aggregate_filename: "adaptive_encounters.jsonl"
