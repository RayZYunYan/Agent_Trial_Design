# Benchmark grid eval — medqa_0000..0049 × 9 (A1,A2) forced paths.
# Run: python -m smart_trial.run_eval --config smart_trial/config/eval/config_grid.yaml

run:
  mode: smart_grid

eval:
  fix_persona_per_case: true
  case_ids: null   # defaults to medqa_0000..0049

trial:
  stage1_turns: 4
  stage2_turns: 6
  R1_responder_threshold: 6
  R2_high_confidence_threshold: 0.7

data:
  source: "local"
  local:
    path: "data/all_dev_good.jsonl"
    max_cases: null
  red_flag_cache: "smart_trial/data/red_flag_cache.json"

models:
  patient_simulator:
    provider: "groq"
    model_name: "llama-3.1-8b-instant"
    temperature: 0.3
  doctor_agent:
    provider: "groq"
    model_name: "llama-3.1-8b-instant"
    temperature: 0.5
  judge:
    provider: "groq"
    model_name: "llama-3.1-8b-instant"
    temperature: 0.1

randomization:
  seed: 42
  stratify_by: "case_category"

persona:
  mode: "per_case_seed"

rag:
  enabled: true
  k: 3
  index_cache: "smart_trial/data/bm25_index.pkl"

logging:
  output_dir: "smart_trial/outputs/eval/grid"
  aggregate_filename: "grid_encounters.jsonl"
