# Pilot: 5 grid runs = 5 cases × 1 path (A1a→A2a). API dialogue + real judge.
#   python smart_trial/scripts/run_pilot_pipeline.py
#   or: python -m smart_trial.run_eval --config smart_trial/config/eval/config_grid_pilot.yaml --no-resume

run:
  mode: smart_grid

eval:
  fix_persona_per_case: true
  case_ids:
    - medqa_0000
    - medqa_0001
    - medqa_0002
    - medqa_0003
    - medqa_0004
  grid_paths:
    - [A1a, A2a]

trial:
  stage1_turns: 2
  stage2_turns: 3
  R1_responder_threshold: 6
  R2_high_confidence_threshold: 0.7

data:
  source: "local"
  local:
    path: "data/all_dev_good.jsonl"
    max_cases: null
  red_flag_cache: "smart_trial/data/red_flag_cache.json"

models:
  patient_simulator:
    provider: anthropic
    model_name: claude-haiku-4-5
    temperature: 0.3
  doctor_agent:
    provider: anthropic
    model_name: claude-sonnet-4-6
    temperature: 0.5
  judge:
    provider: anthropic
    model_name: claude-haiku-4-5
    temperature: 0.1

randomization:
  seed: 42

persona:
  mode: "per_case_seed"

rag:
  enabled: false

logging:
  output_dir: "smart_trial/outputs/eval/pilot/grid"
  aggregate_filename: "grid_encounters.jsonl"
