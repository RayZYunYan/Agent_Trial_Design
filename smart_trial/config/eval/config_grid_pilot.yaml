# Pilot: 3 grid runs = 3 cases × 1 path (A1a→A2a). Groq dialogue + mock judge.
#   set SMART_TRIAL_MOCK_JUDGE=1
#   python -m smart_trial.run_eval --config smart_trial/config/eval/config_grid_pilot.yaml --no-resume

run:
  mode: smart_grid

eval:
  fix_persona_per_case: true
  case_ids:
    - medqa_0000
    - medqa_0001
    - medqa_0002
  grid_paths:
    - [A1a, A2a]

trial:
  stage1_turns: 2
  stage2_turns: 3
  R1_responder_threshold: 6
  R2_high_confidence_threshold: 0.7

data:
  source: "local"
  local:
    path: "data/all_dev_good.jsonl"
    max_cases: null

models:
  patient_simulator:
    provider: "groq"
    model_name: "llama-3.1-8b-instant"
    temperature: 0.3
  doctor_agent:
    provider: "groq"
    model_name: "llama-3.1-8b-instant"
    temperature: 0.5
  judge:
    provider: "groq"
    model_name: "llama-3.1-8b-instant"
    temperature: 0.1

randomization:
  seed: 42

persona:
  mode: "per_case_seed"

rag:
  enabled: false

logging:
  output_dir: "smart_trial/outputs/eval/pilot/grid"
  aggregate_filename: "grid_encounters.jsonl"
