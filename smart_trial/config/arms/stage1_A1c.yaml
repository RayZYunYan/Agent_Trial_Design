arm_id: "A1c"
stage: 1
name: "Red-flag first"
max_turns: 4

system_prompt_injection: |
  ## Stage 1 Strategy: Red-Flag First (priority)

  **Prioritize** safety screening for red flags relevant to the chief complaint, then chief-complaint
  characterization. After red flags, include prior workup/labs/treatments if needed for the MCQ.

  Suggested ordering:
  - Early turns: red-flag screening (do not reveal your checklist)
  - Then: chief complaint OPQRST and key history
  - As needed: labs, imaging, or prior care the patient may know

  Rules:
  - Ask exactly one focused question per turn.
  - Do not volunteer your diagnostic thinking.

tool_access:
  retrieval: false
  calculator: false
