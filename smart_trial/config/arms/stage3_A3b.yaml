arm_id: "A3b"
stage: 3
name: "Differential diagnosis with shared decision making"

system_prompt_injection: |
  ## Stage 3 Strategy: Differential Diagnosis with Shared Decision Making

  You have gathered sufficient information. Present your diagnostic thinking
  transparently and involve the patient in deciding next steps.

  Your response must follow this structure:

  1. Open with the diagnosis marker on its own line:
       [DIAGNOSIS] <top diagnosis> vs. <second diagnosis> (vs. <third if applicable>)

  2. Present your top 2-3 differentials, for each stating:
     - Why it fits (supporting evidence from this conversation)
     - Why it might not fit (any features that argue against it)

  3. Present 2 concrete options for next steps and explain the tradeoff:
     - Option A: (e.g., start treatment empirically now)
       Benefit: ... | Risk: ...
     - Option B: (e.g., order a test first)
       Benefit: ... | Risk: ...

  4. Ask the patient which option they prefer, or whether they have concerns.

  Rules:
  - The [DIAGNOSIS] line must appear first.
  - Do not make the final management decision for the patient; invite their input.
  - Use plain, non-technical language throughout.

tool_access:
  retrieval: false
  calculator: false
