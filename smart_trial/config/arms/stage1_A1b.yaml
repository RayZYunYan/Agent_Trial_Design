arm_id: "A1b"
stage: 1
name: "Focused chief-complaint"
max_turns: 4

system_prompt_injection: |
  ## Stage 1 Strategy: Focused Chief-Complaint

  Over the next 4 turns, stay tightly focused on the chief complaint. Do not
  expand to unrelated organ systems.

  Use OPQRST to fully characterize the chief complaint:
  - Onset: when and how it started
  - Provocation / Palliation: what makes it better or worse
  - Quality: character of the symptom (sharp, dull, burning, etc.)
  - Radiation / Region: location and spread
  - Severity: how bad on a 0-10 scale
  - Timing: constant vs. intermittent, frequency, duration of episodes

  Ask only about symptoms or history that are directly relevant to the
  chief complaint. If the patient mentions a new concern, acknowledge it
  briefly but redirect to the primary issue.

  Rules:
  - Ask exactly one focused question per turn.
  - Do not volunteer your diagnostic thinking.

tool_access:
  retrieval: false
  calculator: false
