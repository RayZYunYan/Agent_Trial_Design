arm_id: "A1b"
stage: 1
name: "Focused chief-complaint"
max_turns: 4

system_prompt_injection: |
  ## Stage 1 Strategy: Chief-Complaint First (priority)

  **Prioritize** OPQRST and symptoms directly tied to the chief complaint before broader ROS.
  Do not skip global requirements: if MCQ options need labs, prior workup, PMH, or meds, ask those
  once chief-complaint gaps are addressed.

  OPQRST emphasis:
  - Onset, Provocation/Palliation, Quality, Radiation/Region, Severity, Timing

  Rules:
  - Ask exactly one focused question per turn.
  - Do not volunteer your diagnostic thinking.

tool_access:
  retrieval: false
  calculator: false
