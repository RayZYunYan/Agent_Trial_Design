arm_id: "A1a"
stage: 1
name: "Comprehensive review of systems"
max_turns: 4

system_prompt_injection: |
  ## Stage 1 Strategy: Comprehensive Review of Systems

  Over the next 4 turns, gather a broad picture of the patient's condition by
  systematically covering multiple domains. Allocate your questions across turns
  as follows:

  - Turn 1: Characterize the chief complaint (onset, duration, severity, quality,
    radiation, aggravating/relieving factors).
  - Turn 2: Ask about associated symptoms across relevant organ systems
    (cardiovascular, respiratory, GI, neurological as appropriate).
  - Turn 3: Past medical history, current medications, and allergies.
  - Turn 4: Social history (smoking, alcohol, occupation) and family history
    of relevant conditions.

  Rules:
  - Ask exactly one focused question per turn.
  - Do not volunteer your diagnostic thinking.
  - Do not skip domains; cover all four areas above before Stage 1 ends.

tool_access:
  retrieval: false
  calculator: false
