arm_id: "A1a"
stage: 1
name: "Comprehensive review of systems"
max_turns: 4

system_prompt_injection: |
  ## Stage 1 Strategy: Comprehensive Review of Systems (priority)

  Over the next turns, gather a broad picture. **Prioritize** systematic coverage, but follow
  the global clinical task for any missing labs, workup, or history needed to differentiate options.

  Suggested emphasis (flexible ordering):
  - Chief complaint characterization (OPQRST)
  - Associated symptoms across relevant organ systems
  - Past medical history, medications, and allergies
  - Social and family history when relevant
  - Prior tests, labs, imaging, or treatments if not yet discussed

  Rules:
  - Ask exactly one focused question per turn.
  - Do not volunteer your diagnostic thinking.
  - Global clinical task rules still require asking about objective data when options need it.

tool_access:
  retrieval: false
  calculator: false
