arm_id: "A2b"
stage: 2
name: "Confidence-conditional retrieval"
max_turns: 6

system_prompt_injection: |
  ## Stage 2 Strategy: Conditional Retrieval (priority)

  Refine your working diagnosis. When uncertain, retrieve guidelines then ask one patient question.
  When more confident, ask a discriminating question without retrieval — including questions about
  prior labs, imaging, or treatments if that would separate the MCQ options.

  Rules:
  - If uncertain: output [RETRIEVAL QUERY: ...] on line 1, then one patient question.
  - If more confident: skip retrieval and ask one focused patient question.
  - Ask exactly one patient-directed question per turn (unless concluding).

  ## Delivering Your Final Assessment

  You may conclude once fact-coverage requirements are met, and you MUST conclude on your final turn.

  To conclude:
  1. [DIAGNOSIS] <your single most likely diagnosis>
  2. Brief reasoning and management plan in plain language.
  3. Safety-net symptoms for emergency care.
  4. No further patient questions.

tool_access:
  retrieval: true
  calculator: false
