trial:
  stage1_turns: 4
  stage2_turns: 6
  R2_high_confidence_threshold: 0.7

  # Fact-coverage early stop (hot-swappable). Replaces doctor [CONFIDENCE] gating.
  coverage:
    enabled: true
    check_every: 5              # judge incremental probe every N doctor turns
    threshold: 0.50             # 50% atomic facts elicited → allow MCQ finalize / early stop
    gate_mcq_finalize: true     # block MediQ finalize when coverage below threshold
    stage1_min_turns: 5         # Stage 1 must run at least this many turns
    stage2_min_turns: 3         # Stage 2 must run at least this many turns
    r2_high_threshold: 0.50     # R2 "high" when final coverage_rate >= this
    summary_subdir: "coverage_summaries"

  rounds:
    mode: "fixed"                    # fixed | adaptive
    stage1:
      min_turns: 5
    stage2:
      min_turns: 3

# Cases: local JSONL (MediQ-style) or HuggingFace stellalisy/mediQ.
# Full merged set (2685): data/all_mediq_craft_merged.jsonl
# Smaller dev subset (1272): data/all_dev_good.jsonl — used by eval benchmark configs
data:
  source: "local"                   # local | huggingface
  local:
    path: "data/all_mediq_craft_merged.jsonl"
    max_cases: null                 # null = all lines read
  huggingface:
    split: "validation"
    max_cases: null
  # Optional per-case red flags (build with scripts/build_category_red_flag_cache.py)
  red_flag_cache: "smart_trial/data/red_flag_cache.json"

# Hot-swap backends here (repo-root .env: GROQ_API_KEY; CURSOR_API_KEY for cursor_sdk).
# CARC benchmark uses Anthropic — see smart_trial/config/eval/models_claude.yaml
# Strategy / arms: config/arms/*.yaml (see doc/SMART_Implementation_Plan.md).
# Supported providers: mock | groq | openai | anthropic | gemini | cursor_sdk
models:
  patient_simulator:
    provider: "groq"
    model_name: "llama-3.1-8b-instant"
    temperature: 0.3
  doctor_agent:
    provider: "groq"
    model_name: "llama-3.1-8b-instant"
    temperature: 0.5
  judge:
    provider: "groq"
    model_name: "llama-3.1-8b-instant"
    temperature: 0.1

randomization:
  seed: 42
  stratify_by: "case_category"

# Patient persona — controls HOW the patient communicates (not what they know).
# modes:
#   off         -> no persona, original Fact-Select behaviour
#   fixed       -> every case uses persona.fixed_id (load from config/personas/<id>.yaml)
#   random      -> sample all axes per case, reproducible via case_id seed
#   demographic -> auto-pick by age (low_literacy for <18 or >=70, else default)
#   per_case    -> read case["persona_id"] if set, else demographic fallback
persona:
  mode: "random"

rag:
  enabled: true
  k: 3                                        # number of passages to retrieve
  retriever_mode: "hybrid"                    # bm25 | contriever | hybrid
  index_cache: "smart_trial/data/bm25_index.pkl"
  contriever_cache: "smart_trial/data/contriever_embeddings.npy"
  contriever_model: "facebook/contriever"
  rrf_k: 60

logging:
  # One JSON object per line; one encounter per case (append across batch runs).
  output_file: "smart_trial/outputs/encounters.jsonl"
  format: "jsonl"

# MediQ interactive layer (BasicExpert MVP). Default off — existing SMART runs unchanged.
mediq:
  enabled: false
  expert_class: "BasicExpert"
  rationale_generation: true
  self_consistency: 1
  stage1_suppress_answer: true
  stage2_allow_mcq_finalize: true
  shadow_choice_enabled: false
