trial:
  max_turns: 20
  stage1_turns: 4
  stage2_turns: 6
  stage3_max_turns: 10
  R1_responder_threshold: 6        # score >= 6 out of 10 = responder
  R2_high_confidence_threshold: 0.7

# Cases: use local JSONL (MediQ-style dev file in repo) or HuggingFace iMEDQA.
data:
  source: "local"                   # local | huggingface
  local:
    path: "data/all_dev_good.jsonl"
    max_cases: null                 # null = all lines read
  huggingface:
    split: "validation"
    max_cases: null
  # Optional per-case red flags (build with scripts/build_category_red_flag_cache.py)
  red_flag_cache: "smart_trial/data/red_flag_cache.json"

# Hot-swap backends here (repo-root .env: GROQ_API_KEY; GEMINI_API_KEY only if you use gemini).
# Pilot: one small Groq model for patient + doctor + judge — free tier friendly, lower token cost.
# Strategy / arms: config/arms/*.yaml (see doc/SMART_Implementation_Plan.md).
# Supported providers: mock | groq | openai | anthropic | gemini
models:
  patient_simulator:
    provider: "groq"
    model_name: "llama-3.1-8b-instant"
    temperature: 0.3
  doctor_agent:
    provider: "groq"
    model_name: "llama-3.1-8b-instant"
    temperature: 0.5
  judge:
    provider: "groq"
    model_name: "llama-3.1-8b-instant"
    temperature: 0.1

randomization:
  seed: 42
  stratify_by: "case_category"

# Health-Literacy Persona (HOW the patient talks).
# See smart_trial/core/persona.py. Levels map to Nutbeam (2000):
#   literacy_F = functional, literacy_I = interactive, literacy_C = critical.
# mode:
#   "off"          -> no persona; existing Fact-Select behavior
#   "fixed"        -> every case uses persona.fixed_id
#   "demographic"  -> select_default_persona_id (stereotype caveat applies)
#   "per_case"     -> read case["persona"] if set, else demographic fallback
persona:
  mode: "fixed"
  fixed_id: "literacy_I"

# mode:
#   "off"      -> no TDP
#   "fixed"    -> every case uses trust_persona.fixed_id
#   "per_case" -> read case["trust_persona"] if set, else fall back to fixed_id
trust_persona:
  mode: "per_case"
  fixed_id: "cooperative"

logging:
  output_dir: "smart_trial/outputs/encounters"
  format: "jsonl"
